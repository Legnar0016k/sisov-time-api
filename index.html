<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Descarte de Hora API</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex flex-col items-center justify-center min-h-screen font-mono">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl border border-slate-700 text-center max-w-lg w-full">
        <h1 class="text-xl mb-6 text-slate-400 uppercase tracking-widest">Diagnóstico de API</h1>
        
        <div class="space-y-6">
            <div class="bg-black/30 p-4 rounded-lg">
                <p class="text-xs text-amber-500 mb-2">1. Respuesta Cruda de Railway:</p>
                <code id="raw-data" class="text-emerald-400 break-all text-sm">Cargando...</code>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-slate-700/50 p-4 rounded-lg border border-slate-600">
                    <p class="text-[10px] text-slate-400 uppercase">Hora de tu PC</p>
                    <p id="pc-time" class="text-xl font-bold text-white">--:--:--</p>
                </div>
                <div class="bg-amber-900/20 p-4 rounded-lg border border-amber-700/30">
                    <p class="text-[10px] text-amber-500 uppercase">Hora API (Forzada VZ)</p>
                    <p id="api-time" class="text-xl font-bold text-amber-400">--:--:--</p>
                </div>
            </div>

            <button onclick="probarAPI()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-xl font-bold transition-all">
                REINTENTAR SINCRONIZACIÓN
            </button>
        </div>
    </div>

    <script>
        async function probarAPI() {
            const rawEl = document.getElementById('raw-data');
            const apiEl = document.getElementById('api-time');
            const pcEl = document.getElementById('pc-time');

            // 1. Mostrar hora de la PC
            pcEl.textContent = new Date().toLocaleTimeString();

            try {
                // 2. Llamar a la API
                const res = await fetch('https://web-production-81e05.up.railway.app/hora-venezuela');
                const data = await res.json();
                
                // Mostrar el JSON tal cual viene
                rawEl.textContent = JSON.stringify(data);

                if (data.ok && data.iso) {
                    // PRUEBA DE FUEGO:
                    // Usamos la propiedad 'iso' pero le quitamos la 'Z' al final 
                    // para evitar que el navegador la convierta a hora local.
                    const isoLimpia = data.iso.replace('Z', '');
                    const fechaVzla = new Date(isoLimpia);

                    apiEl.textContent = fechaVzla.toLocaleTimeString('es-VE', {
                        hour: '2-digit',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    });
                }
            } catch (err) {
                rawEl.textContent = "Error: " + err.message;
                rawEl.classList.replace('text-emerald-400', 'text-red-400');
            }
        }

        // Ejecutar al cargar
        probarAPI();
        // Actualizar hora PC cada segundo
        setInterval(() => {
            document.getElementById('pc-time').textContent = new Date().toLocaleTimeString();
        }, 1000);
    </script>
</body>
</html>
